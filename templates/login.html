<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-5">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            Iniciar sesión
                        </h2>

                        {% if error %}
                            <div class="alert alert-danger">
                                {{ error }}
                            </div>
                        {% endif %}

                        <form method="POST" action="/login">

                            <div class="mb-3">

                                <label
                                    for="usuario"
                                    class="form-label"
                                >
                                    Usuario
                                </label>

                                <input
                                    type="text"
                                    id="usuario"
                                    name="usuario"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label"
                                >
                                    Contraseña
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Iniciar sesión
                            </button>

                        </form>

                        <div class="text-center mt-4">

                            <p>
                                ¿No tienes una cuenta?
                            </p>

                            <a
                                href="/registro"
                                class="btn btn-outline-secondary"
                            >
                                Crear cuenta
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
