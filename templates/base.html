<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Monitoreo de Biodiversidad y Aracnofauna</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="bg-success text-white text-center p-4">
    <h1>Sistema de Monitoreo de Biodiversidad y Aracnofauna</h1>
    <p class="mb-0">
        Registro, catalogación y análisis ecológico de especies
    </p>
</header>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="{{ url_for('home') }}">
            Aracnofauna
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('home') }}">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('especies') }}">
                        Registrar especies
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<main class="container my-4">

    {% block content %}
    {% endblock %}

</main>

<footer class="bg-dark text-white text-center p-3 mt-5">

    <p class="mb-0">
        Sistema de Monitoreo de Biodiversidad y Aracnofauna
    </p>

    <small>
        Estación Experimental Latitud Cero - ULEAM, Pedernales
    </small>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
