<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoreo de Biodiversidad</title>
    <!-- Bootstrap para mantener tu diseño responsive -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu archivo CSS original -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Tu encabezado verde original -->
    <header style="background-color: #28a745; color: white; padding: 20px; text-align: center;">
        <h1>Sistema de Monitoreo de Biodiversidad y Aracnofauna</h1>
        <p>Registro, catalogación y análisis ecológico de especies</p>
    </header>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('home') }}">Inicio</a>
                <a class="nav-link" href="{{ url_for('productos') }}">Productos</a>
                <a class="nav-link" href="{{ url_for('clientes') }}">Clientes</a>
                <a class="nav-link" href="{{ url_for('proveedores') }}">Proveedores</a>
                <a class="nav-link" href="{{ url_for('facturacion') }}">Facturación</a>
            </div>
        </div>
    </nav>

    <!-- AQUÍ SE CARGARÁ EL CONTENIDO DE LAS OTRAS PÁGINAS -->
    <main class="container my-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
