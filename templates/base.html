<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Biodiversidad</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <nav style="
        background: #198754;
        padding: 18px;
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
    ">

        <a
            href="{{ url_for('home') }}"
            style="color:white; text-decoration:none; font-weight:bold;"
        >
            🏠 INICIO
        </a>

        <a
            href="{{ url_for('especies') }}"
            style="color:white; text-decoration:none;"
        >
            🐸 ESPECIES
        </a>

        <a
            href="{{ url_for('productos') }}"
            style="color:white; text-decoration:none;"
        >
            📦 PRODUCTOS
        </a>

        <a
            href="{{ url_for('clientes') }}"
            style="color:white; text-decoration:none;"
        >
            👥 CLIENTES
        </a>

        <a
            href="{{ url_for('proveedores') }}"
            style="color:white; text-decoration:none;"
        >
            🚚 PROVEEDORES
        </a>

        <a
            href="{{ url_for('facturacion') }}"
            style="color:white; text-decoration:none;"
        >
            🧾 FACTURACIÓN
        </a>


        {% if current_user.is_authenticated %}

            <span style="
                color:yellow;
                font-weight:bold;
                margin-left:auto;
            ">
                👤 {{ current_user.usuario }}
            </span>

            <a
                href="{{ url_for('logout') }}"
                style="
                    color:white;
                    background:#dc3545;
                    padding:8px 12px;
                    border-radius:5px;
                    text-decoration:none;
                    font-weight:bold;
                "
            >
                🚪 CERRAR SESIÓN
            </a>

        {% else %}

            <a
                href="{{ url_for('login') }}"
                style="color:white; text-decoration:none;"
            >
                🔐 INICIAR SESIÓN
            </a>

            <a
                href="{{ url_for('registro') }}"
                style="color:white; text-decoration:none;"
            >
                ✍️ CREAR CUENTA
            </a>

        {% endif %}

    </nav>


    <main>

        {% block content %}

        {% endblock %}

    </main>


    <script
        src="{{ url_for('static', filename='js/script.js') }}"
    ></script>

</body>

</html>
